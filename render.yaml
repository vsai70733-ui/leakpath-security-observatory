services:
  - type: web
    name: leakpath-security-observatory
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: MANUS_PROJECT_ID
        sync: false
      - key: MANUS_JWT_SECRET
        generateValue: true
      - key: MANUS_OAUTH_PORTAL_URL
        sync: false
      - key: MANUS_OAUTH_API_URL
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
